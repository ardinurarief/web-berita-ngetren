<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/3541/3541235.png" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <!-- Ganti src dengan logo asli Anda nanti -->
                <a href="home.html" onclick="filterCategory('all')">Ngetren</a>
            </div>

            <!-- Tombol Hamburger (Icon Gambar) -->
            <div class="hamburger" id="hamburger-btn">
                <img src="https://cdn-icons-png.flaticon.com/128/1828/1828859.png" alt="Menu" />
            </div>

            <!-- Menu Links -->
            <ul class="nav-links" id="nav-menu">
                <li><a href="home.html" class="active" onclick="filterCategory('all')">Beranda</a></li>
                <li><a href="home.html?cat=Bola" onclick="filterCategory('Bola')">Bola</a></li>
                <li><a href="home.html?cat=Teknologi" onclick="filterCategory('Teknologi')">Tekno</a></li>
                <li><a href="home.html?cat=Lifestyle" onclick="filterCategory('Lifestyle')">Lifestyle</a></li>
                <li><a href="home.html?cat=Keuangan" onclick="filterCategory('Keuangan')">Bisnis</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div id="article-container" class="article-detail">
            <div class="loading">Memuat konten...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; 2026 Ngetren All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/174/174855.png" alt="Instagram" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5969/5969020.png" alt="Twitter" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5968/5968764.png" alt="Facebook" /></a>
            </div>
        </div>
    </footer>

    <script>
        // FIX BUG BACK BUTTON: Paksa reload jika halaman diambil dari cache
        window.onpageshow = function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const isVisited = urlParams.get('visited') === 'true';

            if (!slug) {
                window.location.href = 'index.html';
                return;
            }

            fetch('data/articles.json')
                .then(response => response.json())
                .then(articles => {
                    const article = articles.find(a => a.slug === slug);

                    if (article) {
                        document.title = article.title;
                        const container = document.getElementById('article-container');

                        // Render Konten + Share Button + Back Button
                        container.innerHTML = `
                            <header class="article-header">
                                <span class="article-category" style="opacity: 0; margin: 0;">${article.category}</span>
                                <h1 class="article-title">${article.title}</h1>
                                <div class="article-meta">Dipublikasikan: ${new Date(article.date).toLocaleDateString('id-ID')} <span class="article-category" style="margin-left: 10px;">${article.category}</span></div>
                            </header>
                            
                            <img src="${article.image}" alt="${article.title}" class="article-image">
                            
                            <div class="article-content">
                                ${article.content}
                            </div>

                            <!-- SHARE BUTTONS -->
                            <div class="share-container">
                                <h3>Bagikan Berita Ini:</h3>
                                <div class="share-buttons">
                                    <button class="share-btn wa" onclick="shareToWA()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/4423/4423697.png" alt="WA">
                                    </button>
                                    <button class="share-btn fb" onclick="shareToFB()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/3128/3128304.png" alt="FB">
                                    <button class="share-btn x" onclick="shareToX()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/5968/5968958.png" alt="X">
                                    </button>
                                    <button class="share-btn copy" onclick="copyLink()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/18789/18789564.png" alt="Copy">
                                    </button>
                                </div>
                            </div>
                        `;

                        // LOGIKA REDIRECT
                        if (!isVisited) {
                            setTimeout(() => {
                                const newUrl = `${window.location.pathname}?slug=${slug}&visited=true`;
                                window.history.replaceState({ path: newUrl }, '', newUrl);
                                window.location.href = article.affiliate_link;
                            }, 1000);
                        }

                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => console.error(err));
        });

        // FUNGSI SHARE (Diletakkan di global scope agar bisa dipanggil onclick)
        function getShareUrl() {
            return window.location.origin + window.location.pathname + '?slug=' + new URLSearchParams(window.location.search).get('slug');
        }

        function shareToWA() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://wa.me/?text=${text}%20${url}`, '_blank');
        }

        function shareToFB() {
            const url = encodeURIComponent(getShareUrl());
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function shareToX() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }

        function copyLink() {
            const url = getShareUrl();
            navigator.clipboard.writeText(url).then(() => {
                alert("✅ Link berhasil disalin!");
            }).catch(err => {
                console.error('Gagal menyalin: ', err);
            });
        }
    </script>
</body>

</html>
