<head>
    <meta charset="UTF-8">

    <meta property="og:description" content="Portal berita terkini.">
    <meta property="og:image" content="https://web-berita-ngetren.vercel.app/news.png">

    <link rel="icon" href="https://web-berita-ngetren.vercel.app/news.png" />

</head>

<body>

        <div class="container nav-container">

                <img src="https://cdn-icons-png.flaticon.com/128/1828/1828859.png" alt="Menu" />
            </div>
            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html" onclick="filterCategory('all')">Beranda</a></li>

                <!-- Kategori Utama -->
                <li><a href="#" onclick="filterCategory('Politik & Pemerintahan')">Politik</a></li>
                <li><a href="#" onclick="filterCategory('Ekonomi & Bisnis')">Bisnis</a></li>
                <li><a href="#" onclick="filterCategory('Sains & Teknologi')">Tekno</a></li>
                <li><a href="#" onclick="filterCategory('Olahraga (Sports)')">Olahraga</a></li>

                <!-- Dropdown Menu -->
                <li class="dropdown">
                    <!-- Tambahkan ID 'dropbtn-lainnya' di sini -->
                    <a href="#" id="dropbtn-lainnya" class="dropbtn">Lainnya ▾</a>
                    <div class="dropdown-content">
                        <a href="#" onclick="filterCategory('Hukum & Kriminal')">Hukum & Kriminal</a>
                        <a href="#" onclick="filterCategory('Sosial & Budaya')">Sosial & Budaya</a>
                        <a href="#" onclick="filterCategory('Internasional')">Internasional</a>

                    </div>
                </li>
            </ul>
        </div>

    <main class="container">
        <div id="article-container" class="article-detail">
            <div class="loading">Memuat konten...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; 2026 Ngetren All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/174/174855.png" alt="Instagram" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5968/5968958.png" alt="Twitter" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5968/5968764.png" alt="Facebook" /></a>
            </div>
        </div>
    </footer>

        <script>
        // =========================================
        // 1. LOGIKA UTAMA ARTIKEL & REDIRECT PINTAR
        // =========================================
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (!slug) {
                window.location.href = 'index.html';
                return;
            }

            fetch('data/articles.json')
                .then(response => response.json())
                .then(articles => {
                    const article = articles.find(a => a.slug === slug);

                    if (article) {
                        // A. RENDER KONTEN
                        document.title = `${article.title} - Ngetren News`;
                        const container = document.getElementById('article-container');
                        
                        container.innerHTML = `
                            <header class="article-header">
                                <span class="article-category">${article.category}</span>
                                <h1 class="article-title">${article.title}</h1>
                                <div class="article-meta">Dipublikasikan: ${new Date(article.date).toLocaleDateString('id-ID')}</div>
                            </header>
                            
                            <img src="${article.image}" alt="${article.title}" class="article-image">
                            
                            <div class="article-content">
                                ${article.content}
                            </div>

                            <!-- SHARE BUTTONS -->
                           <div class="share-container">
                                <h3>Bagikan Berita Ini:</h3>
                                <div class="share-buttons">
                                    <button class="share-btn wa" onclick="shareToWA()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/4423/4423697.png" alt="WA">
                                    </button>
                                    <button class="share-btn fb" onclick="shareToFB()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/3128/3128304.png" alt="FB">
                                    </button>
                                    <button class="share-btn x" onclick="shareToX()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/5968/5968958.png" alt="X">
                                    </button>
                                    <button class="share-btn copy" onclick="copyLink()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/18789/18789564.png" alt="Copy">
                                    </button>
                                </div>
                            </div>
                        `;

                        // B. JALANKAN CEK REDIRECT
                        checkAndRedirect(article);

                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => console.error(err));
        });

        // FUNGSI CEK DAN REDIRECT (SILENT MODE)
        function checkAndRedirect(article) {
            const slug = article.slug;
            const now = Date.now();
            
            // Ambil waktu redirect terakhir dari penyimpanan browser
            const lastRedirectTime = localStorage.getItem('last_redirect_' + slug);
            
            // Atur batas waktu: 5 Menit (300.000 ms)
            // Jika belum pernah redirect ATAU sudah lewat 5 menit, maka redirect lagi.
            // Jika masih di bawah 5 menit, diam saja (user bisa baca).
            if (!lastRedirectTime || (now - parseInt(lastRedirectTime)) > 300000) {
                
                setTimeout(() => {
                    // Simpan waktu sekarang sebagai tanda sudah redirect
                    localStorage.setItem('last_redirect_' + slug, now.toString());
                    
                    // Eksekusi redirect ke Shopee
                    window.location.href = article.affiliate_link;
                }, 3000); // Tunggu 3 detik agar user sempat lihat judul
            }
            // Jika kondisi di atas tidak terpenuhi (masih dalam 5 menit), 
            // maka tidak ada kode yang dijalankan. User bebas membaca.
        }

        // =========================================
        // 2. FUNGSI SHARE
        // =========================================
        function getShareUrl() {
            return window.location.origin + window.location.pathname + '?slug=' + new URLSearchParams(window.location.search).get('slug');
        }

        function shareToWA() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://wa.me/?text=${text}%20${url}`, '_blank');
        }

        function shareToFB() {
            const url = encodeURIComponent(getShareUrl());
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function shareToX() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }

        function copyLink() {
            const url = getShareUrl();
            navigator.clipboard.writeText(url).then(() => {
                alert("Link berhasil disalin!");
            }).catch(err => {
                console.error('Gagal menyalin: ', err);
            });
        }
    </script>
    <script src="js/logic.js"></script> 
</body>

</html>
