<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- DEFAULT META TAGS (Akan di-update oleh JS) -->
    <title>Getren News</title>
    <meta name="description" content="Portal berita terkini dan rekomendasi produk terbaik.">
    
    <!-- Open Graph Default -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ardinurarief.github.io/web-berita-ngetren/home.html">
    <meta property="og:title" content="Getren - Portal Berita Terkini & Rekomendasi Produk">
    <meta property="og:description"
        content="Baca berita terbaru seputar teknologi, bola, bisnis, dan lifestyle. Temukan rekomendasi produk terbaik hanya di Getren.">
    <meta property="og:image" content="https://ardinurarief.github.io/web-berita-ngetren/news.png">

    <link rel="icon" href="" />
    <link rel="stylesheet" href="css/desain.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="https://cdn-icons-png.flaticon.com/128/3541/3541235.png" alt="Logo" />
                <span style="margin-top: 5px;">getren</span>
            </div>
            
            <div class="search-box desktop-search">
                <input type="text" id="search-input" placeholder="Cari berita...">
                <img src="https://cdn-icons-png.flaticon.com/128/622/622669.png" alt="Search" class="search-icon">
            </div>

            <div class="nav-right-actions">
                <div class="mobile-search-trigger" id="mobile-search-btn">
                    <img src="https://cdn-icons-png.flaticon.com/128/622/622669.png" alt="Search" />
                </div>
                <div class="hamburger" id="hamburger-btn">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828859.png" alt="Menu" />
                </div>
            </div>

            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="#" onclick="filterCategory('Politik & Pemerintahan')">Politik</a></li>
                <li><a href="#" onclick="filterCategory('Ekonomi & Bisnis')">Bisnis</a></li>
                <li><a href="#" onclick="filterCategory('Sains & Teknologi')">Tekno</a></li>
                <li><a href="#" onclick="filterCategory('Olahraga (Sports)')">Bola</a></li>
                <li class="dropdown">
                    <a href="#" id="dropbtn-lainnya" class="dropbtn">Lainnya ▾</a>
                    <div class="dropdown-content">
                        <a href="#" onclick="filterCategory('Hukum & Kriminal')">Hukum</a>
                        <a href="#" onclick="filterCategory('Sosial & Budaya')">Sosial</a>
                        <a href="#" onclick="filterCategory('Internasional')">Global</a>
                        <a href="#" onclick="filterCategory('Gaya Hidup & Hiburan')">Lifestyle</a>
                        <a href="#" onclick="filterCategory('Pendidikan')">Edukasi</a>
                        <a href="#" onclick="filterCategory('Kesehatan')">Sehat</a>
                    </div>
                </li>
            </ul>
        </div>
        
        <!-- Mobile Search Bar -->
        <div class="mobile-search-bar" id="mobile-search-bar">
            <div class="container">
                <input type="text" id="search-input-mobile" placeholder="Ketik judul atau kategori...">
                <img src="https://cdn-icons-png.flaticon.com/128/622/622669.png" alt="Search" class="search-icon">
            </div>
        </div>
    </nav>

    <!-- KONTEN ARTIKEL -->
    <main class="container main-content">
        <div id="article-container" class="article-detail">
            <div class="loading">Memuat konten...</div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-wrapper">
            <div class="footer-col brand-col">
                <div class="logo-footer">
                    <img src="https://cdn-icons-png.flaticon.com/128/3541/3541235.png" alt="Logo">
                    <span>getren</span>
                </div>
                <p>Portal berita terkini yang menyajikan informasi tajam dan rekomendasi produk terbaik.</p>
            </div>
            <div class="footer-col social-col">
                <h3>Ikuti Kami</h3>
                <div class="social-links">
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/733/733558.png" alt="Instagram"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/733/733579.png" alt="Twitter"></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Ngetren Media. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // FUNGSI HELPER UPDATE META TAG
        function updateMetaTag(property, content) {
            let element = document.querySelector(`meta[property="${property}"]`);
            if (!element) {
                element = document.createElement('meta');
                element.setAttribute('property', property);
                document.head.appendChild(element);
            }
            element.content = content;
        }

        function updateNameMeta(name, content) {
            let element = document.querySelector(`meta[name="${name}"]`);
            if (!element) {
                element = document.createElement('meta');
                element.setAttribute('name', name);
                document.head.appendChild(element);
            }
            element.content = content;
        }

        // FIX BUG BACK BUTTON: Paksa reload total jika kembali dari redirect
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const isVisited = urlParams.get('visited') === 'true';

            if (!slug) {
                window.location.href = 'index.html';
                return;
            }

            fetch('data/articles.json')
                .then(response => response.json())
                .then(articles => {
                    const article = articles.find(a => a.slug === slug);

                    if (article) {
                        // 1. UPDATE META TAGS UNTUK SHARE
                        document.title = `${article.title} - Getren News`;
                        updateMetaTag('og:title', article.title);
                        updateMetaTag('og:description', article.metadeskripsi || article.title);
                        updateMetaTag('og:image', article.image); // Gunakan link asli agar FB/WA bisa baca
                        updateMetaTag('og:url', window.location.href);
                        updateMetaTag('og:type', 'article');
                        
                        updateNameMeta('twitter:card', 'summary_large_image');
                        updateNameMeta('twitter:title', article.title);
                        updateNameMeta('twitter:description', article.metadeskripsi || article.title);
                        updateNameMeta('twitter:image', article.image);

                        // 2. RENDER KONTEN
                        const container = document.getElementById('article-container');
                        container.innerHTML = `
                            <header class="article-header">
                                <span class="article-category" style="opacity: 0; margin: 0;">${article.category}</span>
                                <h1 class="article-title">${article.title}</h1>
                                <div class="article-meta">Dipublikasikan: ${new Date(article.date).toLocaleDateString('id-ID')} <span class="article-category" style="margin-left: 10px;">${article.category}</span></div>
                            </header>
                            
                            <img src="${article.image}" alt="${article.title}" class="article-image">
                            
                            <div class="article-content">
                                ${article.content}
                            </div>

                            <!-- SHARE BUTTONS -->
                            <div class="share-container">
                                <h3>Bagikan Berita Ini:</h3>
                                <div class="share-buttons">
                                    <button class="share-btn wa" onclick="shareToWA()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/4423/4423697.png" alt="WA">
                                    </button>
                                    <button class="share-btn fb" onclick="shareToFB()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/3128/3128304.png" alt="FB">
                                    </button>
                                    <button class="share-btn x" onclick="shareToX()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/5968/5968958.png" alt="X">
                                    </button>
                                    <button class="share-btn copy" onclick="copyLink()">
                                        <img src="https://cdn-icons-png.flaticon.com/128/18789/18789564.png" alt="Copy">
                                    </button>
                                </div>
                         </div>

                            <a href="index.html" class="back-to-home">
                                <img src="https://cdn-icons-png.flaticon.com/128/1828/1828859.png" alt="Back Icon">
                                Kembali ke Beranda
                            </a>
                        `;

                        // 3. LOGIKA REDIRECT
                        if (!isVisited) {
                            setTimeout(() => {
                                const newUrl = `${window.location.pathname}?slug=${slug}&visited=true`;
                                window.history.replaceState({path: newUrl}, '', newUrl);
                                window.location.href = article.affiliate_link;
                            }, 1000);
                        }
                        
                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => console.error(err));
        });

        // FUNGSI SHARE
        function getShareUrl() {
            return window.location.origin + window.location.pathname + '?slug=' + new URLSearchParams(window.location.search).get('slug');
        }

        function shareToWA() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://wa.me/?text=${text}%20${url}`, '_blank');
        }

        function shareToFB() {
            const url = encodeURIComponent(getShareUrl());
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function shareToX() {
            const url = encodeURIComponent(getShareUrl());
            const text = encodeURIComponent(document.title);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }

        function copyLink() {
            const url = getShareUrl();
            navigator.clipboard.writeText(url).then(() => {
                alert("✅ Link berhasil disalin!");
            }).catch(err => {
                console.error('Gagal menyalin: ', err);
            });
        }
    </script>
</body>
</html>
