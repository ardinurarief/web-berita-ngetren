<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Ngetren adalah portal berita terkini yang menyajikan informasi tajam dan rekomendasi produk terbaik. Baca berita terbaru seputar teknologi, bola, bisnis, dan lifestyle hanya di Ngetren." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://web-berita-ngetren.vercel.app/home.html">
    <meta property="og:title" content="Ngetren - Portal Berita Terkini & Rekomendasi Produk">
    <meta property="og:description"
        content="Baca berita terbaru seputar teknologi, bola, bisnis, dan lifestyle. Temukan rekomendasi produk terbaik hanya di Getren.">
    <meta property="og:image" content="https://web-berita-ngetren.vercel.app/news.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://web-berita-ngetren.vercel.app/home.html">
    <meta property="twitter:title" content="Ngetren - Portal Berita Terkini">
    <meta property="twitter:description"
        content="Portal berita terkini yang menyajikan informasi tajam dan rekomendasi produk terbaik.">
    <meta property="twitter:image" content="https://web-berita-ngetren.vercel.app/news.png">

    <title>Ngetren - Portal Berita Terkini</title>
    <link rel="icon" href="https://web-berita-ngetren.vercel.app/news.png" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Navigation (Sama seperti sebelumnya) -->
    <nav class="navbar">
        <div class="container nav-container">
            <!-- Logo -->
            <div class="logo">
                <a href="home.html" onclick="filterCategory('all')">Ngetren</a>
            </div>

            <!-- Search Box Desktop (Hanya muncul di Laptop) -->
            <div class="search-box desktop-search">
                <input type="text" id="search-input" placeholder="Cari berita..." />
                <img src="https://cdn-icons-png.flaticon.com/128/622/622669.png" alt="Search" class="search-icon" />
            </div>

            <!-- Bagian Kanan: Tombol Search Mobile & Hamburger -->
            <div class="nav-right-actions">
                <!-- Tombol Search Icon (Hanya Mobile) -->
                <div class="mobile-search-trigger" id="mobile-search-btn">
                    <img src="https://cdn-icons-png.flaticon.com/128/622/622669.png" alt="Search" />
                </div>

                <!-- Hamburger Menu -->
                <div class="hamburger" id="hamburger-btn">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828859.png" alt="Menu" />
                </div>
            </div>

            <!-- Menu Links -->
            <ul class="nav-links" id="nav-menu">
                <li><a href="home.html" onclick="filterCategory('all')">Beranda</a></li>

                <!-- Kategori Utama -->
                <li><a href="#" onclick="filterCategory('Politik & Pemerintahan')">Politik</a></li>
                <li><a href="#" onclick="filterCategory('Ekonomi & Bisnis')">Bisnis</a></li>
                <li><a href="#" onclick="filterCategory('Sains & Teknologi')">Tekno</a></li>
                <li><a href="#" onclick="filterCategory('Olahraga (Sports)')">Bola</a></li>

                <!-- Dropdown Menu -->
                <li class="dropdown">
                    <!-- Tambahkan ID 'dropbtn-lainnya' di sini -->
                    <a href="#" id="dropbtn-lainnya" class="dropbtn">Lainnya ▾</a>
                    <div class="dropdown-content">
                        <a href="#" onclick="filterCategory('Hukum & Kriminal')">Hukum & Kriminal</a>
                        <a href="#" onclick="filterCategory('Sosial & Budaya')">Sosial & Budaya</a>
                        <a href="#" onclick="filterCategory('Internasional')">Internasional</a>
                        <a href="#" onclick="filterCategory('Gaya Hidup & Hiburan')">Lifestyle</a>
                        <a href="#" onclick="filterCategory('Pendidikan')">Pendidikan</a>
                        <a href="#" onclick="filterCategory('Kesehatan')">Kesehatan</a>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Kolom Pencarian Mobile (Tersembunyi Default, Muncul Saat Ikon Diklik) -->
        <div class="mobile-search-bar" id="mobile-search-bar">
            <div class="container">
                <input type="text" id="search-input-mobile" placeholder="Ketik judul atau kategori...">
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <!-- HERO SECTION (Headline Utama) -->
        <section id="hero-section" class="hero-section">
            <!-- Akan diisi oleh JS -->
            <div class="loading-hero">Memuat Headline...</div>
        </section>

        <!-- CONTENT WRAPPER (Grid 2 Kolom: Main & Sidebar) -->
        <div class="content-wrapper">
            <!-- KOLOM KIRI: Berita Terbaru -->
            <div class="main-column">
                <div class="section-title">
                    <h2>Berita Terbaru</h2>
                    <div class="title-line"></div>
                </div>
                <div id="article-grid" class="news-list">
                    <!-- List artikel akan muncul di sini -->
                </div>
                <div class="load-more-container">
                    <button id="load-more-btn" class="btn-load-more">Muat Lebih Banyak</button>
                </div>
            </div>

            <!-- KOLOM KANAN: Sidebar (Populer/Kategori) -->
            <aside class="sidebar-column">
                <div class="section-title">
                    <h2>Terpopuler</h2>
                    <div class="title-line"></div>
                </div>
                <div id="sidebar-list" class="sidebar-list">
                    <!-- Sidebar items -->
                </div>

                <div class="read-also-section" style="margin-top: 40px;">
                    <div class="section-title">
                        <h2>Baca Juga</h2>
                        <div class="title-line"></div>
                    </div>
                    <div id="read-also-list" class="sidebar-list">
                        <!-- Diisi oleh JS -->
                    </div>
                </div>

                <div class="ad-placeholder">
                    <p>Advertisement</p>
                </div>
            </aside>

        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; 2026 Ngetren All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/174/174855.png" alt="Instagram" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5968/5968958.png" alt="Twitter" /></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5968/5968764.png" alt="Facebook" /></a>
            </div>
        </div>
    </footer>

    <script src="js/logic.js"></script>
    <script>
        window.addEventListener('resize', () => {
            const mobileSearchBar = document.getElementById('mobile-search-bar');

            // Jika lebar layar lebih dari 768px (Desktop/Tablet besar)
            if (window.innerWidth > 768) {
                if (mobileSearchBar) {
                    mobileSearchBar.classList.remove('active');
                }

                // Opsional: Reset juga menu hamburger jika terbuka
                const navMenu = document.getElementById('nav-menu');
                if (navMenu) navMenu.classList.remove('active');
            }
        });
    </script>
</body>

</html>
